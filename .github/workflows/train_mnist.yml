name: MNIST Training Pipeline

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run training
      run: |
        python train_mnist.py

    - name: Authenticate with GitHub
      run: |
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}

    - name: Commit results (logs + model)
      run: |
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git add train_output.md test_output.md mnist_model.pt images/ docs/mnist_model.onnx
        git commit -m "Auto: Updated training logs, models, and ONNX" || echo "Nothing to commit"
        git push origin HEAD:${{ github.ref_name }}
